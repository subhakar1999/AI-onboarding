# version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentforge_postgres
    environment:
      POSTGRES_USER: agentforge_admin
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: agentforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge_admin -d agentforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: agentforge_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentforge_admin:SecurePass123!@db:5432/agentforge_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy-key}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: